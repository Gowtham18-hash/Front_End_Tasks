<!-- Grid -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
</head>
<style>
    .container{
        display:flex;
        margin: 20px;
        justify-content: space-evenly;
        /* flex-wrap: wrap; */
    }
    .box{     
        border: 1px solid black;
        /* margin: 20px; */
        padding: 20px;
        background-color: rgb(68, 252, 255);
    }
    .gridContainer{
        display:grid;
        grid-template-columns: 4fr 3fr 3fr;
        gap:20px;
    }
    .child{
        padding: 20px;
        background-color: orange;
        border: 1px solid white ; 
    }
    .child1{
        grid-column: span 2;
    }
    .child2{
        grid-row: span 2;
    }
    .child3{
        grid-row: span 2/4;
    }
    .child5{
        grid-column:span 2/4;
    }
    .child6{
        grid-column: span 3;
    }
    
</style>
<body>
     <h1>Display flex by Gowtham B</h1>
    <div class ="container">
        <div class="box box1"> Item 1</div>
        <div class="box box2"> Item 2</div>
        <div class="box box3"> Item 3</div>
        <div class="box box4"> Item 4</div>
        <div class="box box5"> Item 5</div>
        <div class="box box6"> Item 6</div>
    </div>
    <h1>Display Grid</h1>
    <div class=" gridContainer">
        <div class="child child1"> Item 1</div>
        <div class="child child2"> Item 2</div>
        <div class="child child3"> Item 3</div>
        <div class="child child4"> Item 5</div>
        <div class="child child5"> Item 4</div>
        <div class="child child6"> Item 6</div>
    </div>
</body>
</html>
