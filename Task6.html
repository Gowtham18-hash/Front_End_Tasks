<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>website</title>
</head>
<style>
    body{
        background-image: url(images/bg1.png);
        background-size: cover;
    }
    #container{
        display: flex;
        justify-content: space-between;
    }
    #left{
        margin-left: 100px;
        color: white;
        display: flex;
        justify-content: space-between;
        cursor: pointer;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    #right{
        color: white;
        display: flex;
        gap: 20px;
    }
    #company_name:hover{
        color: rgb(100, 100, 133);
        
    }
    p{
        margin-bottom: 20px;
        cursor: pointer;
    }
    p:hover{
        color: rgb(100, 100, 133);
    }
    #started:hover{
        color: black;
        background-color: rgb(100, 100, 133);   
    }
    #msg{
        height: 50px;
        width: 50px;
        margin-left: 95%;
        margin-top: 5px;
        position:sticky;
    }
    #content{
        color: white;
        font-size: 50px;
        margin-left: 100px;
    }
    #button{
        padding: 20px;
        border-radius: 10px;
        font-family: Arial, Helvetica, sans-serif;
        cursor: pointer;
        font-size: medium;
    }
    #button:hover{
        background-color: black;
        color: white;
    }
    @keyframes transition{
        0%{transform:translate(-400px,0);opacity: 0;}
        100%{transform:translate(0,0);opacity: 1;}
    }
    #content{
        animation: transition 2s ease 1;
    }
    
</style>
<body>
    <div id="container">
        <div id="left">
        <h2 id="company_name">Gowtham.io</h2>
    </div>
    <div id="right">
        <p>Solutions</p>
        <p>Vision</p>
        <p>Program</p>
        <p>Blog</p>
        <p>Login</p>
    <p id="started"
        style="border: 2px solid white; 
        border-radius: 5px; 
        padding: 5px;">
        Get started
    </p><br>
    </div>
    </div>
    <div id="content">
        <div id="content_one"><h1>The New Standard <br>in Data Analysis</h1></div>
        <div id="content_two"><h3>Use Data to Get a 360-Degree <br> view of Your Business </h3></div>
        <div><button id="button">Learn More</button></div>
    </div>  
    <div id="message_logo">
        <img id="msg" src="/images/logo.png" alt="">
    </div>
          
</body>
</html>
